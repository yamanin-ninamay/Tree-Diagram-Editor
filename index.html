<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree Diagram Editor</title>
<style>
  :root{
    --bg:#1b1f24; --panel:#23282f; --panel2:#2a3038; --border:#39414d;
    --text:#e8eaed; --muted:#9aa4b0; --accent:#4a90d9; --accent2:#67c286;
    --danger:#e06c60; --radius:8px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden;}

  /* ---------- Top bar ---------- */
  #topbar{display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap;}
  #topbar .logo{font-weight:700; font-size:16px; white-space:nowrap;}
  #site-title{background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:var(--radius); padding:7px 10px; width:180px;}
  #search-wrap{position:relative; flex:1; min-width:200px; max-width:420px;}
  #search{width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:var(--radius); padding:7px 10px;}
  #search-results{position:absolute; top:105%; left:0; right:0; background:var(--panel2); border:1px solid var(--border); border-radius:var(--radius); max-height:260px; overflow-y:auto; display:none; z-index:50;}
  #search-results .sr-item{padding:8px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--border);}
  #search-results .sr-item:hover{background:var(--accent);}
  #search-results .sr-item.active{background:var(--accent);}
  #search-results .sr-empty{padding:8px 12px; font-size:13px; color:var(--muted);}
  .btn{background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:7px 14px; border-radius:var(--radius); cursor:pointer; font-size:13px; white-space:nowrap;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); font-weight:600;}
  .btn.primary:hover{filter:brightness(1.15);}

  /* ---------- Main layout ---------- */
  #main{flex:1; display:flex; min-height:0;}
  #left{width:380px; min-width:280px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column;}
  #tree-panel{flex:1; overflow-y:auto; padding:12px;}
  #preview-wrap{flex:1; position:relative; overflow:hidden; background:radial-gradient(ellipse at top, #20262e 0%, var(--bg) 70%);}
  #preview{width:100%; height:100%; display:block;}

  /* ---------- Tree editor rows ---------- */
  .t-row{display:flex; align-items:center; gap:4px; padding:3px 6px; border-radius:6px; cursor:pointer; user-select:none;}
  .t-row:hover{background:var(--panel2);}
  .t-row.selected{background:#33455c; outline:1px solid var(--accent);}
  .t-caret{width:18px; text-align:center; color:var(--muted); cursor:pointer; flex-shrink:0; font-size:11px;}
  .t-caret.hidden-caret{visibility:hidden;}
  .t-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-right:2px;}
  .t-name{flex:1; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .link-row{display:flex; gap:4px; margin-bottom:6px; align-items:center;}
  .link-row input{min-width:0; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit;}
  .link-row .lk-label{width:90px; flex-shrink:0;}
  .link-row .lk-url{flex:1;}
  #links-edit{margin-bottom:6px;}
  .t-name.is-leaf{color:#a8d5b5;}
  .t-actions{display:none; gap:2px;}
  .t-row.selected .t-actions, .t-row:hover .t-actions{display:flex;}
  .t-btn{background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:2px 4px; border-radius:4px;}
  .t-btn:hover{color:var(--text); background:var(--border);}
  .t-btn.del:hover{color:var(--danger);}
  .t-children{margin-left:18px; border-left:1px dashed var(--border); padding-left:6px;}

  /* ---------- Properties panel ---------- */
  #props-panel{border-top:1px solid var(--border); padding:14px; background:var(--panel2); max-height:46%; overflow-y:auto;}
  #props-panel h3{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:10px;}
  #props-panel label{display:block; font-size:12px; color:var(--muted); margin-bottom:8px;}
  #props-panel input[type=text], #props-panel textarea{width:100%; margin-top:3px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit;}
  #props-panel textarea{resize:vertical; min-height:52px;}
  .prop-row{display:flex; gap:10px;}
  .prop-row > label{flex:1;}
  input[type=color]{width:36px; height:26px; border:1px solid var(--border); border-radius:6px; background:none; margin-top:3px; cursor:pointer; vertical-align:middle;}
  .badge-checks{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
  .badge-checks label{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text); margin:0;}
  .badge-edit-row{display:flex; gap:6px; margin-bottom:6px; align-items:center;}
  .badge-edit-row input{background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:5px 7px; font-size:12px;}
  .badge-edit-row .be-key{width:34px; text-align:center; text-transform:uppercase; font-weight:700;}
  .badge-edit-row .be-label{flex:1;}

  /* ---------- Info card (preview popup) ---------- */
  #info-card{position:absolute; top:20px; left:20px; width:290px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px; z-index:40; box-shadow:0 8px 30px rgba(0,0,0,.45); display:none;}
  #info-card h4{font-size:15px; margin-bottom:8px;}
  #info-card .ic-desc{font-size:12px; color:var(--muted); margin-bottom:8px; line-height:1.5;}
  #info-card a{color:var(--accent); font-size:12px; word-break:break-all; display:block; margin-bottom:4px;}
  #info-card .ic-badges{margin-top:8px; display:flex; gap:5px;}
  #info-card .ic-close{position:absolute; top:8px; right:10px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px;}
  .mini-badge{display:inline-block; min-width:18px; height:18px; line-height:18px; text-align:center; border-radius:4px; background:var(--accent); color:#fff; font-size:11px; font-weight:700; padding:0 4px;}

  /* ---------- Export preview overlay ---------- */
  #preview-overlay{position:fixed; inset:0; background:#10151b; z-index:200; display:none; flex-direction:column;}
  #preview-overlay.open{display:flex;}
  #preview-bar{display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--border);}
  .pv-title{font-size:13px; color:var(--muted);}
  .pv-note{font-size:12px; color:var(--amber,#d98e3f); flex:1; text-align:right;}
  #preview-frame{flex:1; border:0; width:100%; background:#1e2227;}

  /* ---------- Toast / misc ---------- */
  #toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:10px 22px; border-radius:24px; font-size:13px; z-index:100; box-shadow:0 4px 18px rgba(0,0,0,.4); transition:opacity .3s; opacity:0; pointer-events:none;}
  #toast.show{opacity:1;}
  #offline-warn{position:absolute; bottom:14px; left:14px; background:#5c4a25; border:1px solid #8a7434; color:#ffe9b0; font-size:12px; padding:8px 12px; border-radius:6px; display:none; max-width:340px;}
  .empty-hint{color:var(--muted); font-size:13px; padding:20px; text-align:center; line-height:1.7;}
</style>
</head>
<body>

<header id="topbar">
  <span class="logo">Tree Diagram Editor</span>
  <input id="site-title" type="text" placeholder="Site title">
  <div id="search-wrap">
    <input id="search" type="text" placeholder="Search nodes... (Enter = go to first)">
    <div id="search-results"></div>
  </div>
  <span style="flex:1"></span>
  <button class="btn" id="btn-import-json">Import JSON</button>
  <input type="file" id="file-json" accept=".json,application/json" hidden>
  <button class="btn" id="btn-export-json">Export JSON</button>
  <button class="btn" id="btn-preview-site">Preview Site</button>
  <button class="btn primary" id="btn-export-site">Export Website</button>
</header>

<div id="main">
  <aside id="left">
    <div id="tree-panel"></div>
    <div id="props-panel">
      <h3>Node Properties</h3>
      <label>Name
        <input type="text" id="p-name">
      </label>
      <label>Links
        <div id="links-edit"></div>
        <button class="btn" id="btn-add-link" type="button">Add link</button>
      </label>
      <label>Description
        <textarea id="p-desc"></textarea>
      </label>
      <div class="prop-row">
        <label>Color<input type="color" id="p-color"></label>
      </div>
      <label>Badges
        <div class="badge-checks" id="p-badges"></div>
      </label>
      <hr style="border-color:var(--border); margin:12px 0;">
      <h3>Legend / Badge Labels</h3>
      <div id="legend-edit"></div>
    </div>
  </aside>

  <div id="preview-wrap">
    <svg id="preview"></svg>
    <div id="info-card">
      <button class="ic-close" id="ic-close">✕</button>
      <h4 id="ic-title"></h4>
      <div class="ic-desc" id="ic-desc"></div>
      <div id="ic-links"></div>
      <div class="ic-badges" id="ic-badges"></div>
    </div>
    <div id="offline-warn">⚠ D3.js could not load from CDN — live preview disabled until you are online. Editing still works.</div>
  </div>
</div>

<div id="toast"></div>

<div id="preview-overlay">
  <div id="preview-bar">
    <span class="pv-title">Export preview — this is exactly what visitors will see</span>
    <span class="pv-note" id="pv-note"></span>
    <button class="btn" id="pv-open" type="button">Open in new tab</button>
    <button class="btn primary" id="pv-download" type="button">Download</button>
    <button class="btn" id="pv-close" type="button">✕ Close</button>
  </div>
  <iframe id="preview-frame" sandbox="allow-scripts allow-popups allow-forms allow-modals"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
"use strict";
/* =====================================================================
   TREE DIAGRAM EDITOR
   Design a collapsible node tree visually, then export it as a
   standalone website.
   ===================================================================== */

var D3_CDN = "https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js";
var LS_KEY = "tree-diagram-editor-v1";

/* ---------------- state ---------------- */
var uidCounter = 1;
function newNode(name){
  return { id: uidCounter++, name: name || "New Node", links:[], desc:"", color:"", badges:[], children:[] };
}
var state = {
  siteTitle: "My Tree Diagram",
  badgeDefs: [
    { key:"I", label:"Important" },
    { key:"L", label:"Has external link" },
    { key:"D", label:"Documentation available" },
    { key:"R", label:"Requires registration" }
  ],
  root: newNode("Root"),
  selectedId: null,
  collapsed: {}    // id -> true means collapsed
};

function findNode(node, id){
  if(node.id === id) return node;
  for(var i=0;i<node.children.length;i++){
    var r = findNode(node.children[i], id);
    if(r) return r;
  }
  return null;
}
function findParent(node, id){
  for(var i=0;i<node.children.length;i++){
    if(node.children[i].id === id) return node;
    var r = findParent(node.children[i], id);
    if(r) return r;
  }
  return null;
}
function pathToRoot(id){
  var path = [], n = findNode(state.root, id);
  while(n){ path.push(n.id); var p = findParent(state.root, n.id); n = p; }
  return path.reverse();
}
function stripIds(node){
  // produce clean data copy without runtime ids
  return {
    name: node.name, links: (node.links||[]).map(function(l){ return { label:l.label, url:l.url }; }), desc: node.desc,
    color: node.color, badges: node.badges.slice(),
    children: node.children.map(stripIds)
  };
}

/* ---------------- persistence ---------------- */
var saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  }, 250);
}
function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    var s = JSON.parse(raw);
    if(!s || typeof s !== "object") return false;
    if(!s.root || typeof s.root !== "object" || typeof s.root.name !== "string" || !Array.isArray(s.root.children)) return false;
    // validate storage the same way imports are validated — never trust persisted state
    if(typeof s.siteTitle !== "string") s.siteTitle = "My Tree Diagram";
    s.badgeDefs = (Array.isArray(s.badgeDefs) ? s.badgeDefs : []).filter(function(b){
      return b && typeof b === "object" && typeof b.key === "string" && b.key && typeof b.label === "string";
    });
    state = s;
    // normalize every node field — never trust persisted state shapes
    (function mig(n){
      if(typeof n.name !== "string") n.name = String(n.name || "");
      if(typeof n.desc !== "string") n.desc = "";
      if(typeof n.color !== "string") n.color = "";
      if(!Array.isArray(n.badges)) n.badges = [];
      if(!Array.isArray(n.links)){ n.links = (typeof n.url === "string" && n.url) ? [{label:"", url:n.url}] : []; }
      delete n.url;
      if(!Array.isArray(n.children)) n.children = [];
      n.children.forEach(mig);
    })(state.root);
    // fix uid counter
    (function bump(n){ uidCounter = Math.max(uidCounter, (n.id||0)+1); if(Array.isArray(n.children)) n.children.forEach(bump); })(state.root);
    return true;
  }catch(e){ return false; }
}

/* ---------------- helpers ---------------- */
function $(sel){ return document.querySelector(sel); }
function toast(msg){
  var t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function escHtml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function safeUrl(u){
  if(typeof u !== "string") return "";
  u = u.trim();
  if(!u) return "";
  // auto-add https:// to bare domains like "example.com/x" so user input just works
  if(!/^https?:\/\//i.test(u) && !/^\//.test(u) && /^[\w-]+(\.[\w-]+)+([\/?#].*)?$/i.test(u)) u = "https://" + u;
  return /^https?:\/\//i.test(u) || /^\//.test(u) && !/^\/\//.test(u) ? u : "";
}
function isLeaf(node){ return node.children.length === 0; }

/* =====================================================================
   SIDE PANEL — tree editor
   ===================================================================== */
function renderTreePanel(){
  var panel = $("#tree-panel");
  panel.innerHTML = "";
  var container = document.createElement("div");
  buildBranch(container, state.root, 0);
  panel.appendChild(container);

  function buildBranch(parentEl, node, depth){
    var row = document.createElement("div");
    row.className = "t-row" + (node.id === state.selectedId ? " selected" : "");
    row.dataset.id = node.id;

    var caret = document.createElement("span");
    caret.className = "t-caret" + (isLeaf(node) ? " hidden-caret" : "");
    caret.textContent = state.collapsed[node.id] ? "▶" : "▼";
    caret.addEventListener("click", function(e){
      e.stopPropagation();
      toggleCollapse(node.id);
    });

    var dot = document.createElement("span");
    dot.className = "t-dot";
    dot.style.background = node.color || "#4a90d9";

    var name = document.createElement("span");
    name.className = "t-name" + (isLeaf(node) ? " is-leaf" : "");
    name.title = node.name;
    name.textContent = node.name;

    var actions = document.createElement("span");
    actions.className = "t-actions";
    actions.appendChild(mkBtn("➕", "Add child", function(e){ e.stopPropagation(); addChild(node.id); }));
    actions.appendChild(mkBtn("＋", "Add sibling", function(e){ e.stopPropagation(); addSibling(node.id); }));
    actions.appendChild(mkBtn("↑", "Move up", function(e){ e.stopPropagation(); moveNode(node.id, -1); }));
    actions.appendChild(mkBtn("↓", "Move down", function(e){ e.stopPropagation(); moveNode(node.id, 1); }));
    actions.appendChild(mkBtn("✕", "Delete", function(e){ e.stopPropagation(); deleteNode(node.id); }, "del"));

    row.appendChild(caret);
    row.appendChild(dot);
    row.appendChild(name);
    row.appendChild(actions);
    row.addEventListener("click", function(){ selectNode(node.id); });
    parentEl.appendChild(row);

    if(!isLeaf(node) && !state.collapsed[node.id]){
      var kids = document.createElement("div");
      kids.className = "t-children";
      parentEl.appendChild(kids);
      node.children.forEach(function(c){ buildBranch(kids, c, depth+1); });
    }
  }
  function mkBtn(label, title, fn, cls){
    var b = document.createElement("button");
    b.className = "t-btn" + (cls ? " "+cls : "");
    b.textContent = label;
    b.title = title;
    b.addEventListener("click", fn);
    return b;
  }
}

function toggleCollapse(id){
  if(state.collapsed[id]) delete state.collapsed[id];
  else state.collapsed[id] = true;
  saveState();
  renderTreePanel();
  rebuildDiagram();
}

function selectNode(id){
  state.selectedId = id;
  renderTreePanel();
  renderProps();
}

function addChild(parentId){
  var p = findNode(state.root, parentId);
  if(!p) return null;
  var c = newNode("New Node");
  p.children.push(c);
  delete state.collapsed[p.id];
  afterStructureChange(c.id);
  return c.id;
}
function addSibling(id){
  if(id === state.root.id) return addChild(id);
  var p = findParent(state.root, id);
  if(!p) return null;
  var idx = p.children.findIndex(function(c){ return c.id === id; });
  var c = newNode("New Node");
  p.children.splice(idx+1, 0, c);
  afterStructureChange(c.id);
  return c.id;
}
function moveNode(id, dir){
  var p = findParent(state.root, id);
  if(!p) return;
  var idx = p.children.findIndex(function(c){ return c.id === id; });
  var ni = idx + dir;
  if(ni < 0 || ni >= p.children.length) return;
  var tmp = p.children[idx]; p.children[idx] = p.children[ni]; p.children[ni] = tmp;
  afterStructureChange(id);
}
function deleteNode(id){
  if(id === state.root.id){ toast("Cannot delete the root node"); return; }
  var p = findParent(state.root, id);
  if(!p) return;
  if(!confirm("Delete this node and all its children?")) return;
  var deletedSubtree = p.children.find(function(c){ return c.id === id; });
  p.children = p.children.filter(function(c){ return c.id !== id; });
  // purge collapsed-map entries of the deleted subtree
  (function purge(n){ delete state.collapsed[n.id]; n.children.forEach(purge); })(deletedSubtree);
  if(state.selectedId === id) state.selectedId = null;
  afterStructureChange(null);
}
function afterStructureChange(selectId){
  saveState();
  if(selectId) state.selectedId = selectId;
  renderTreePanel();
  renderProps();
  rebuildDiagram();
}

/* =====================================================================
   PROPERTIES PANEL
   ===================================================================== */
function selectedNode(){
  return state.selectedId ? findNode(state.root, state.selectedId) : null;
}
function renderProps(){
  var n = selectedNode();
  var has = !!n;
  ["p-name","p-desc","p-color"].forEach(function(id){ $("#"+id).disabled = !has; });
  $("#p-name").value = has ? n.name : "";
  $("#p-desc").value = has ? n.desc : "";
  $("#p-color").value = has && n.color ? n.color : "#4a90d9";
  $("#btn-add-link").disabled = !has;
  renderLinkRows();
  renderBadgeChecks();
  renderLegendEdit();
}
// rebuild the multi-link editor rows for the selected node
function renderLinkRows(){
  var wrap = $("#links-edit");
  wrap.innerHTML = "";
  var n = selectedNode();
  if(!n){ return; }
  n.links.forEach(function(link, i){
    var row = document.createElement("div");
    row.className = "link-row";

    var label = document.createElement("input");
    label.className = "lk-label";
    label.placeholder = "Label";
    label.value = link.label || "";
    label.addEventListener("input", function(){ link.label = this.value; saveState(); });

    var url = document.createElement("input");
    url.className = "lk-url";
    url.placeholder = "https://... (example.com also works)";
    url.value = link.url || "";
    url.addEventListener("input", function(){ link.url = this.value.trim(); saveState(); });
    url.addEventListener("blur", function(){
      var su = safeUrl(this.value);
      if(su && this.value !== su){ this.value = su; link.url = su; saveState(); }
    });

    var del = document.createElement("button");
    del.className = "t-btn del";
    del.textContent = "✕";
    del.title = "Remove this link";
    del.addEventListener("click", function(){
      n.links.splice(i, 1);
      saveState(); renderLinkRows();
    });

    row.appendChild(label);
    row.appendChild(url);
    row.appendChild(del);
    wrap.appendChild(row);
  });
}
function renderBadgeChecks(){
  var wrap = $("#p-badges");
  wrap.innerHTML = "";
  var n = selectedNode();
  state.badgeDefs.forEach(function(bd){
    var lab = document.createElement("label");
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.disabled = !n;
    cb.checked = !!(n && n.badges.indexOf(bd.key) !== -1);
    cb.addEventListener("change", function(){
      if(!n) return;
      if(cb.checked){ if(n.badges.indexOf(bd.key)===-1) n.badges.push(bd.key); }
      else n.badges = n.badges.filter(function(k){ return k !== bd.key; });
      saveState(); rebuildDiagram();
    });
    var span = document.createElement("span");
    var mini = document.createElement("span");
    mini.className = "mini-badge";
    mini.textContent = bd.key;
    span.appendChild(mini);
    lab.appendChild(cb);
    lab.appendChild(span);
    wrap.appendChild(lab);
  });
}
function renderLegendEdit(){
  var wrap = $("#legend-edit");
  wrap.innerHTML = "";
  state.badgeDefs.forEach(function(bd, i){
    var row = document.createElement("div");
    row.className = "badge-edit-row";
    var key = document.createElement("input");
    key.className = "be-key"; key.maxLength = 2; key.value = bd.key;
    key.addEventListener("input", function(){
      var v = key.value.toUpperCase();
      if(v !== key.value) key.value = v;
      if(!v) return;
      // reject duplicates (another def already uses this key)
      var dup = state.badgeDefs.some(function(b){ return b !== bd && b.key === v; });
      if(dup){ toast("Badge \"" + v + "\" already exists"); return; }
      var oldKey = bd.key;
      bd.key = v;
      // migrate on nodes
      state.root && walk(state.root, function(n){ n.badges = n.badges.map(function(k){ return k===oldKey?bd.key:k; }); });
      saveState(); renderBadgeChecks(); rebuildDiagram();
    });
    var lbl = document.createElement("input");
    lbl.className = "be-label"; lbl.placeholder = "What does it mean? (any meaning you want)"; lbl.value = bd.label;
    lbl.addEventListener("input", function(){ bd.label = lbl.value; saveState(); });
    var del = document.createElement("button");
    del.className = "t-btn del"; del.textContent = "✕"; del.title = "Remove this badge";
    del.addEventListener("click", function(){ removeBadgeDef(i); });
    row.appendChild(key); row.appendChild(lbl); row.appendChild(del);
    wrap.appendChild(row);
  });
  var addBtn = document.createElement("button");
  addBtn.className = "btn";
  addBtn.textContent = "➕ Add badge";
  addBtn.style.marginTop = "4px";
  addBtn.addEventListener("click", addBadgeDef);
  wrap.appendChild(addBtn);
  function walk(n, fn){ fn(n); n.children.forEach(function(c){ walk(c, fn); }); }
}
function addBadgeDef(){
  if(state.badgeDefs.length >= 12){ toast("Maximum 12 badges"); return; }
  var used = state.badgeDefs.map(function(b){ return b.key; });
  var k = "";
  for(var c=65; c<=90 && !k; c++){                       // A..Z
    if(used.indexOf(String.fromCharCode(c))===-1) k = String.fromCharCode(c);
  }
  for(var d=48; d<=57 && !k; d++){                        // then 0..9
    if(used.indexOf(String.fromCharCode(d))===-1) k = String.fromCharCode(d);
  }
  if(!k) k = "X" + (state.badgeDefs.length + 1);
  state.badgeDefs.push({ key:k, label:"" });
  saveState(); renderLegendEdit(); renderBadgeChecks();
}
function removeBadgeDef(idx){
  var bd = state.badgeDefs[idx];
  if(!bd) return;
  if(!confirm('Remove badge "' + bd.key + '" and clear it from all nodes?')) return;
  (function strip(n){
    n.badges = n.badges.filter(function(k){ return k !== bd.key; });
    n.children.forEach(strip);
  })(state.root);
  state.badgeDefs.splice(idx, 1);
  saveState(); renderLegendEdit(); renderBadgeChecks(); rebuildDiagram();
}

/* =====================================================================
   LIVE PREVIEW — D3 collapsible tree
   ===================================================================== */
var d3Ready = (typeof d3 !== "undefined");
var diagRoot = null, diagG = null, diagSvg = null, diagZoom = null, diagIndex = 0;
var DIAG = { duration: 350, levelGap: 190 };

// one-shot map of ids to force-expand on the next rebuildDiagram (used by search "goto")
var forceExpandIds = null;

function rebuildDiagram(){
  if(!d3Ready || !diagSvg) return;
  var prevExpanded = {};
  if(diagRoot){
    diagRoot.each(function(d){
      if(d.children) prevExpanded[d.data.id] = true;
    });
  }
  diagG.selectAll("*").remove();
  diagRoot = d3.hierarchy(stripIdsForDiag(state.root), function(d){
    return d.children && d.children.length ? d.children : null;
  });
  diagRoot.x0 = 0; diagRoot.y0 = 0;
  diagIndex = 0;
  // expansion rules: a node is expanded if the user never collapsed it AND
  // (it was previously expanded OR it is top-level by default); nodes in
  // forceExpandIds are opened regardless (search navigation)
  diagRoot.descendants().forEach(function(d){
    if(!d.data.children || !d.data.children.length) return;
    var manualClosed = !!state.collapsed[d.data.id];
    var wasOpen = prevExpanded[d.data.id] !== undefined;
    var defaultOpen = d.depth <= 1; // root + first level visible initially
    var forceOpen = !!(forceExpandIds && forceExpandIds[d.data.id]);
    if(forceOpen || (!manualClosed && (wasOpen || defaultOpen))){
      // leave children attached => node renders expanded
    } else {
      d._children = d.children; d.children = null;
    }
  });
  updateDiagram(diagRoot);
}
function stripIdsForDiag(node){
  return {
    id: node.id, name: node.name, links: (node.links||[]).map(function(l){ return { label:l.label, url:l.url }; }), desc: node.desc,
    color: node.color, badges: node.badges.slice(),
    children: node.children.map(stripIdsForDiag)
  };
}

function initPreview(){
  if(!d3Ready){
    $("#offline-warn").style.display = "block";
    return;
  }
  diagSvg = d3.select("#preview");
  var zoomLayer = diagSvg.append("g");
  diagG = zoomLayer.append("g").attr("transform", "translate(80,0)");
  diagZoom = d3.zoom().scaleExtent([0.2, 2.5]).on("zoom", function(event){
    zoomLayer.attr("transform", event.transform);
  });
  diagSvg.call(diagZoom);
  rebuildDiagram();
}

function updateDiagram(source){
  var wrapEl = $("#preview-wrap");
  var width = wrapEl.clientWidth, height = Math.max(wrapEl.clientHeight, 400);
  diagSvg.attr("viewBox", [0, 0, width, height]);

  var treeLayout = d3.tree().nodeSize([26, DIAG.levelGap]);
  var treeData = treeLayout(diagRoot);
  var nodes = treeData.descendants();
  var links = treeData.links();

  nodes.forEach(function(d){ d.y = d.depth * DIAG.levelGap; });

  /* ---- nodes ---- */
  var node = diagG.selectAll("g.dnode").data(nodes, function(d){ return d.id || (d.id = ++diagIndex); });

  var nodeEnter = node.enter().append("g")
    .attr("class", "dnode")
    .attr("transform", function(d){ return "translate(" + source.y0 + "," + source.x0 + ")"; })
    .attr("opacity", 0)
    .on("click", diagramClick);

  nodeEnter.append("circle")
    .attr("r", 1e-6)
    .style("fill", function(d){ return d._children ? (d.data.color || "#4a90d9") : "#1b1f24"; })
    .style("stroke", function(d){ return d.data.color || "#4a90d9"; })
    .style("stroke-width", 2)
    .style("cursor", "pointer");

  nodeEnter.append("text")
    .attr("dy", ".35em")
    .attr("x", function(d){ return (d.children || d._children) ? 12 : 12; })
    .attr("text-anchor", "start")
    .text(function(d){
      var t = d.data.name;
      return t.length > 42 ? t.slice(0, 40) + "…" : t;
    })
    .style("fill", "#e8eaed")
    .style("font-size", "12.5px")
    .style("cursor", "pointer");

  var nodeUpdate = nodeEnter.merge(node);
  nodeUpdate.transition().duration(DIAG.duration)
    .attr("transform", function(d){ return "translate(" + d.y + "," + d.x + ")"; })
    .attr("opacity", 1);
  nodeUpdate.select("circle")
    .attr("r", 6.5)
    .style("fill", function(d){ return d._children ? (d.data.color || "#4a90d9") : "#1b1f24"; })
    .style("stroke", function(d){ return d._searchHit ? "#ffd54a" : (d.data.color || "#4a90d9"); })
    .style("stroke-width", function(d){ return d._searchHit ? 4 : 2; });

  var nodeExit = node.exit().transition().duration(DIAG.duration)
    .attr("transform", function(d){ return "translate(" + source.y + "," + source.x + ")"; })
    .attr("opacity", 0)
    .remove();
  nodeExit.select("circle").attr("r", 1e-6);
  nodeExit.select("text").style("fill-opacity", 1e-6);

  /* ---- links ---- */
  var link = diagG.selectAll("path.dlink").data(links, function(d){ return d.target.id; });
  var linkEnter = link.enter().insert("path", "g")
    .attr("class", "dlink")
    .attr("fill", "none")
    .attr("stroke", "#39414d")
    .attr("stroke-width", 1.5)
    .attr("d", function(d){
      var o = { x: source.x0, y: source.y0 };
      return diagonal(o, o);
    });
  linkEnter.merge(link).transition().duration(DIAG.duration)
    .attr("d", function(d){ return diagonal(d.source, d.target); });
  link.exit().transition().duration(DIAG.duration)
    .attr("d", function(d){
      var o = { x: source.x, y: source.y };
      return diagonal(o, o);
    })
    .remove();

  nodes.forEach(function(d){
    d.x0 = d.x; d.y0 = d.y;
  });

  function diagonal(s, d){
    var hy = (s.y + d.y) / 2;
    return "M" + s.y + "," + s.x +
           "C" + hy + "," + s.x +
           " " + hy + "," + d.x +
           " " + d.y + "," + d.x;
  }
}

function diagramClick(event, d){
  var hasContent = !!(d.data.desc || (d.data.links && d.data.links.length) || (d.data.badges && d.data.badges.length));
  if(d.children){
    d._children = d.children; d.children = null;
    state.collapsed[d.data.id] = true;
  } else if(d._children){
    d.children = d._children; d._children = null;
    delete state.collapsed[d.data.id];
  }
  // middle nodes with content show their info card too, not just leaves
  if(hasContent || (!d.children && !d._children)) showInfoCard(d.data);
  if(d.children || d._children || hasContent){
    saveState();
    renderTreePanel();
    updateDiagram(d);
  }
}

/* =====================================================================
   SEARCH
   ===================================================================== */
function doSearch(q){
  q = q.trim().toLowerCase();
  var resultsBox = $("#search-results");
  resultsBox.innerHTML = "";
  clearSearchHits(diagRoot);
  if(!q){ resultsBox.style.display = "none"; if(diagRoot) updateDiagram(diagRoot); return; }
  var matches = [];
  (function walk(n, trail){
    if(n.name.toLowerCase().indexOf(q) !== -1) matches.push({ node:n, trail:trail });
    n.children.forEach(function(c){ walk(c, trail.concat([n])); });
  })(state.root, []);
  matches.forEach(function(m){
    var div = document.createElement("div");
    div.className = "sr-item";
    div.textContent = m.trail.map(function(t){ return t.name; }).join(" › ") + " › " + m.node.name;
    div.addEventListener("click", function(){
      gotoSearchResult(m.node);
      resultsBox.style.display = "none";
      $("#search").focus();
    });
    resultsBox.appendChild(div);
  });
  searchActive = -1; // reset keyboard selection whenever results are rebuilt
  resultsBox.style.display = matches.length ? "block" : "none";
  if(matches.length === 0){
    var none = document.createElement("div");
    none.className = "sr-empty";
    none.textContent = "No matches";
    resultsBox.appendChild(none);
  }
  highlightSearchHits(q);
}
function clearSearchHits(diagR){
  if(diagR) diagR.each(function(d){ d._searchHit = false; });
}
function highlightSearchHits(q){
  if(!diagRoot) return;
  diagRoot.each(function(d){ if(d.data.name.toLowerCase().indexOf(q)!==-1) d._searchHit = true; });
  updateDiagram(diagRoot);
}
function gotoSearchResult(node){
  var chain = pathToRoot(node.id);
  chain.forEach(function(id){ if(id !== node.id) delete state.collapsed[id]; });
  // force the diagram rebuild to open every ancestor so deep matches are visible
  forceExpandIds = {};
  chain.forEach(function(id){ if(id !== node.id) forceExpandIds[id] = true; });
  saveState();
  renderTreePanel();
  selectNode(node.id);
  rebuildDiagram();
  forceExpandIds = null; // one-shot: only this navigation forces expansion
  // flash highlight in preview and pan the viewport to the node
  if(diagRoot){
    var hit = null;
    diagRoot.each(function(d){ if(d.data.id === node.id) hit = d; });
    if(hit){
      hit._searchHit = true;
      panToNode(hit);
      updateDiagram(diagRoot);
      setTimeout(function(){ clearSearchHits(diagRoot); if(diagRoot) updateDiagram(diagRoot); }, 2500);
    }
  }
}
// smoothly pan/zoom the preview so the given node is centered on screen
function panToNode(d){
  if(!diagSvg || !diagZoom) return;
  var wrapEl = $("#preview-wrap");
  var width = wrapEl.clientWidth, height = wrapEl.clientHeight;
  var x = d.y + 80, y = d.x; // node position inside the zoom layer (+80 base offset)
  diagSvg.transition().duration(450).call(
    diagZoom.transform,
    d3.zoomIdentity.translate(width / 2 - x, height / 2 - y)
  );
}
$("#search").addEventListener("input", function(){ doSearch(this.value); });
// keyboard navigation between search results: ↓/↑ move, Enter or Tab commits, Escape closes
var searchActive = -1;
function setActiveResult(items, idx){
  searchActive = idx;
  items.forEach(function(el, i){ el.classList.toggle("active", i === idx); });
  if(items[idx] && items[idx].scrollIntoView) items[idx].scrollIntoView({ block: "nearest" });
}
$("#search").addEventListener("keydown", function(e){
  var items = Array.prototype.slice.call($("#search-results").querySelectorAll(".sr-item"));
  if(!items.length) return;
  if(e.key === "ArrowDown"){
    e.preventDefault();
    setActiveResult(items, (searchActive + 1) % items.length);
  } else if(e.key === "ArrowUp"){
    e.preventDefault();
    setActiveResult(items, (searchActive - 1 + items.length) % items.length);
  } else if(e.key === "Enter" || e.key === "Tab"){
    e.preventDefault();
    (items[searchActive] || items[0]).click();
  } else if(e.key === "Escape"){
    $("#search-results").style.display = "none";
  }
});
document.addEventListener("click", function(e){
  if(!$("#search-wrap").contains(e.target)) $("#search-results").style.display = "none";
});

$("#file-json").addEventListener("change", function(){
  var file = this.files[0];
  this.value = "";
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      var tree = parsed.tree || parsed; // accept both wrapper & bare tree json
      validateTree(tree);
      state.root = normalizeTree(tree);
      if(parsed.siteTitle) state.siteTitle = String(parsed.siteTitle);
      if(Array.isArray(parsed.badgeDefs)){
        var cleanDefs = parsed.badgeDefs.filter(function(b){
          return b && typeof b === "object" && typeof b.key === "string" && b.key && typeof b.label === "string";
        }).map(function(b){ return { key: b.key.slice(0,2).toUpperCase(), label: b.label }; });
        if(cleanDefs.length) state.badgeDefs = cleanDefs;
      }
      state.collapsed = {};
      state.selectedId = null;
      $("#site-title").value = state.siteTitle;
      (function bump(n){ uidCounter = Math.max(uidCounter,(n.id||0)+1); n.children.forEach(bump); })(state.root);
      saveState();
      renderTreePanel(); renderProps(); rebuildDiagram();
      toast("Imported successfully");
    }catch(err){
      alert("Import failed: " + err.message);
    }
  };
  reader.readAsText(file);
});
function validateTree(node, depth){
  depth = depth || 0;
  if(depth > 500) throw new Error("Tree is too deep (max 500 levels)");
  if(typeof node !== "object" || node === null) throw new Error("Invalid node");
  if(typeof node.name !== "string") throw new Error('Every node needs a "name" string');
  if(node.children !== undefined && !Array.isArray(node.children)) throw new Error('"children" must be an array');
  (node.children || []).forEach(function(c){ validateTree(c, depth + 1); });
}
function normalizeTree(node){
  return {
    id: uidCounter++,
    name: node.name,
    links: (function(){
      var out = [];
      if(Array.isArray(node.links)){
        node.links.forEach(function(l){
          if(l && typeof l === "object" && typeof l.url === "string") out.push({ label: typeof l.label === "string" ? l.label : "", url: l.url });
        });
      }
      // legacy single-url format
      if(!out.length && typeof node.url === "string" && node.url) out.push({ label:"", url: node.url });
      return out;
    })(),
    desc: typeof node.desc === "string" ? node.desc : "",
    color: typeof node.color === "string" ? node.color : "",
    badges: Array.isArray(node.badges) ? node.badges.filter(function(b){return typeof b==="string";}) : [],
    children: (node.children || []).map(normalizeTree)
  };
}
function safeFilename(s){
  return (s || "export").replace(/[^a-z0-9_\- ]/gi, "").trim().replace(/\s+/g, "-").toLowerCase() || "export";
}
function downloadFile(filename, content, mime){
  var blob = new Blob([content], { type: mime });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

  return insertLineMarker('<!DOCTYPE html>\n' +

// signature marker: exports larger than 1337 lines always carry this comment
// on exactly line 1337 — buried in the middle of the file, never start or end
function insertLineMarker(html){
  var lines = html.split("\n");
  if(lines.length > 1337){
    lines.splice(1336, 0, "<!-- Y-Y;M-M -->"); // index 1336 = line 1337 (1-indexed)
    return lines.join("\n");
  }
  return html;
}
